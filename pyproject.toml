[project]
name = "banku"
version = "0.1.0"
description = "Marathi household-memory voice assistant for Aai and Baba"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.5.4",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "webrtcvad-wheels>=2.0.14.post1",
]

[project.scripts]
banku = "banku.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banku"]
